<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon.png" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <meta
      name="description"
      content="Chips & Bytes — a computer architecture club at SSSIHL."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://miro.medium.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      /* This exists before React loads so the hero never flashes beneath its welcome screen. */
      #welcome-bootstrap {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: grid;
        place-content: center;
        padding: 2rem;
        overflow: hidden;
        color: #101112;
        background: #fff;
        text-align: center;
        transition: opacity 180ms ease, visibility 0s linear 180ms;
      }

      #welcome-bootstrap p {
        margin: 0 0 .35rem;
        opacity: 0;
        font-family: 'IBM Plex Mono', monospace;
        font-size: clamp(.66rem, 1vw, .78rem);
        font-weight: 500;
        letter-spacing: .18em;
        text-transform: uppercase;
        transform: translateY(1rem);
      }

      #welcome-bootstrap h1 {
        margin: 0;
        opacity: 0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(3.2rem, 9vw, 8.8rem);
        font-weight: 520;
        letter-spacing: -.085em;
        line-height: .9;
        transform: translateY(1rem);
      }

      #welcome-bootstrap h1 span {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }

      .welcome-bootstrap__identity {
        position: absolute;
        right: 1.5rem;
        bottom: clamp(2rem, 4vw, 3.2rem);
        left: 1.5rem;
        display: flex;
        justify-content: center;
        gap: clamp(2.5rem, 7vw, 6.5rem);
        font-family: 'IBM Plex Mono', monospace;
        font-size: clamp(.68rem, 1.15vw, .94rem);
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(1rem);
      }

      html:not(.welcome-bootstrap--seen) #root { visibility: hidden; }
      html.welcome-bootstrap--seen #welcome-bootstrap { display: none; }
      html.welcome-app-ready #root { visibility: visible; }
      #welcome-bootstrap.is-handoff { opacity: 0; visibility: hidden; }

      @media (max-width: 520px) {
        .welcome-bootstrap__identity {
          flex-direction: column;
          gap: .5rem;
          font-size: .64rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #welcome-bootstrap { transition-duration: 1ms; }
      }
    </style>
    <script>
      try {
        if (window.location.pathname !== '/' || window.sessionStorage.getItem('chips-and-bytes:welcome-seen') === 'true') {
          document.documentElement.classList.add('welcome-bootstrap--seen');
        }
      } catch (_) {
        // Keep the welcome visible when browser storage is unavailable.
      }
    </script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Chips &amp; Bytes — Systems, made approachable</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="welcome-bootstrap" role="status" aria-label="Welcome to Chips and Bytes">
      <p>Welcome to</p>
      <h1>Chips <span>&amp;</span> Bytes</h1>
      <div class="welcome-bootstrap__identity">
        <span>SSSIHL</span>
        <span>Computer Architecture Club</span>
      </div>
    </div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
